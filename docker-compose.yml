# O Rotamer inteiro: o app e o banco dele.
#
# Para subir a sua instância (ver docs/INSTALACAO.md):
#
#   cp .env.example .env      # e troque POSTGRES_PASSWORD
#   docker compose up -d
#
# Para desenvolver, só o banco sobe daqui — o app roda com `pnpm dev`:
#
#   docker compose up -d postgres
#
# As variáveis de `.env` (ao lado deste arquivo) entram no app; DATABASE_URL é
# montada aqui, apontando para o serviço `postgres`, e ganha de qualquer valor
# que esteja no `.env`.
services:
  app:
    image: ghcr.io/gabrielmello1407/rotamer:latest
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-rotamer}:${POSTGRES_PASSWORD:-rotamer}@postgres:5432/${POSTGRES_DB:-rotamer}
    ports:
      - '${ROTAMER_PORT:-3000}:3000'

  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rotamer}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rotamer}
      POSTGRES_DB: ${POSTGRES_DB:-rotamer}
      # Ordenação e acentuação em português: nome de aluno com acento precisa
      # ordenar direito.
      LANG: pt_BR.utf8
    # Só a própria máquina alcança a porta: é o que permite `pnpm dev` e os
    # scripts de backup falarem com o banco sem expor o 5432 à rede.
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - rotamer-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-rotamer} -d ${POSTGRES_DB:-rotamer}']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  rotamer-postgres:
