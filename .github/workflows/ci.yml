name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # A química é o coração do produto: nenhum aviso de deprecação some no ruído.
  NODE_OPTIONS: --no-warnings

jobs:
  verificacao:
    name: lint · tipos · testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm typecheck

      # O núcleo roda sem navegador — é isso que mantém a química verificável
      # em linha de comando.
      - run: pnpm test

  ponta-a-ponta:
    name: navegador
    runs-on: ubuntu-latest

    # Postgres local, o mesmo do docker-compose.yml e o mesmo que vai rodar no
    # VPS: sem serviço gerenciado em lugar nenhum.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: rotamer
          POSTGRES_PASSWORD: rotamer
          POSTGRES_DB: rotamer
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rotamer -d rotamer"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://rotamer:rotamer@localhost:5432/rotamer?schema=public
      SESSION_SECRET: ci-nao-e-producao

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @rotamer/web exec prisma migrate deploy

      - run: pnpm --filter @rotamer/web exec playwright install --with-deps chromium

      - run: pnpm test:e2e

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7
