name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # A química é o coração do produto: nenhum aviso de deprecação some no ruído.
  NODE_OPTIONS: --no-warnings

jobs:
  verificacao:
    name: lint · tipos · testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm typecheck

      # O núcleo roda sem navegador — é isso que mantém a química verificável
      # em linha de comando.
      - run: pnpm test

  ponta-a-ponta:
    name: navegador
    runs-on: ubuntu-latest

    # O mesmo Postgres do docker-compose.yml: sem serviço gerenciado em lugar
    # nenhum.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: rotamer
          POSTGRES_PASSWORD: rotamer
          POSTGRES_DB: rotamer
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rotamer -d rotamer"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://rotamer:rotamer@localhost:5432/rotamer?schema=public
      # Este trabalho tem Postgres de pé. Um banco inalcançável aqui é defeito
      # do trabalho, não motivo para os testes de ação pularem em silêncio —
      # com a variável, `test/db-guard.ts` falha em vez de pular.
      REQUIRE_DATABASE: '1'

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @rotamer/web exec prisma migrate deploy

      # Único trabalho com Postgres de pé: os testes de ação de servidor que
      # falam com o banco de verdade rodam aqui de fato, e não ficam pulados
      # como no trabalho "lint · tipos · testes", que não tem banco.
      - run: pnpm --filter @rotamer/web exec vitest run app/actions/assignment.test.ts

      - run: pnpm --filter @rotamer/web exec playwright install --with-deps chromium

      - run: pnpm test:e2e

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

  imagem:
    name: imagem Docker
    runs-on: ubuntu-latest

    # A imagem do self-host (D-28) precisa continuar construindo a cada mudança,
    # não só no dia de publicar uma versão. Construir não basta: ela sobe
    # contra um banco novo e precisa responder — é o que quem faz self-host
    # vai ver. Quem publica é `image.yml`, a cada etiqueta `v*`.
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: ghcr.io/gabrielmello1407/rotamer:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Sem `.env`: os padrões do compose, como na primeira subida de alguém.
      - run: docker compose up -d --no-build

      - name: a instância responde
        run: |
          for i in $(seq 1 40); do
            curl -fsS http://127.0.0.1:3000/marca > /dev/null && break
            sleep 3
          done
          curl -fsS http://127.0.0.1:3000/marca > /dev/null
          curl -fsS http://127.0.0.1:3000/m/CCO | grep -q 'C2H6O'
          curl -fsSI http://127.0.0.1:3000/chem/RDKit_minimal.wasm | grep -qi 'immutable'
          docker compose logs app | grep -q 'All migrations have been successfully applied'
          docker compose exec -T app node scripts/promote-teacher.mjs ninguem@rotamer.test --escola CI 2>&1 | grep -q 'Não existe conta'

      - if: ${{ failure() }}
        run: docker compose logs

      - if: ${{ always() }}
        run: docker compose down -v
