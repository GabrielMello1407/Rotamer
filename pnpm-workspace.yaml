packages:
  - apps/*
  - packages/*

# Único pacote com script de instalação nativo — vem do resolvedor de imports do
# eslint-config-next. Sem isto o lint do app não resolve os aliases.
allowBuilds:
  unrs-resolver: true

# pnpm 11 segura versões recém-publicadas por alguns dias. Estas foram
# verificadas e liberadas na fundação do projeto.
minimumReleaseAgeExclude:
  - '@next/env@16.3.3'
  - '@next/eslint-plugin-next@16.3.3'
  - '@next/swc-darwin-arm64@16.3.3'
  - '@next/swc-darwin-x64@16.3.3'
  - '@next/swc-linux-arm64-gnu@16.3.3'
  - '@next/swc-linux-arm64-musl@16.3.3'
  - '@next/swc-linux-x64-gnu@16.3.3'
  - '@next/swc-linux-x64-musl@16.3.3'
  - '@next/swc-win32-arm64-msvc@16.3.3'
  - '@next/swc-win32-x64-msvc@16.3.3'
  - eslint-config-next@16.3.3
  - eslint@9.39.5
  - next@16.3.3
